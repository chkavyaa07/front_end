<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let y=prompt("Enter Marks");
        let x=Number(y);
        if (x>=90 && x<=100) {
            document.write("A+");
            console.log("A+")
        }  
        else if(x>=80 && x<=89){
            document.write("A");
            console.log("A");
        }
        else if(x>=70 && x<=79){
            document.write("B");
            console.log("B");
        }
        else if(x>=60 && x<=69){
            document.write("C");
            console.log("C");
        }
        else if(x>=50 && x<=59){
            document.write("D");
            console.log("D");
        }
        else{
            document.write("Fail");
            console.log("Fail");
        }
        
    </script>
</body>
</html>
