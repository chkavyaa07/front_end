<!DOCTYPE html>
<html>
<head>
  <title>To-Do List</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f1f3f6;
  margin: 0;
}

h2 {
  text-align: center;
  margin-top: 30px;
  color: #333;
}

.wrapper {
  width: 520px;
  margin: 30px auto;
}

.top-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

select {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 12px 15px;
  border: none;
  border-radius: 10px;
  background: #6c63ff;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #574fd6;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: #e9edf3;
  margin-bottom: 12px;
  padding: 15px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.task-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.task-info {
  display: flex;
  flex-direction: column;
}

.time {
  font-size: 12px;
  color: #777;
}

.completed {
  text-decoration: line-through;
  opacity: 0.6;
}

.actions {
  display: flex;
  gap: 12px; 
}

.actions button {
  background: transparent;
  font-size: 18px;
  cursor: pointer;
  padding: 5px;
}

.actions button:hover {
  transform: scale(1.2);
}

.delete-btn:hover {
  color: red;
}

.edit-btn:hover {
  color: orange;
}
</style>
</head>
<body>

<h2>My To-Do List</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();

  if (text === "") return;

  const li = document.createElement("li");


  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";


  const span = document.createElement("span");
  span.textContent = " " + text;


  checkbox.onchange = function () {
    if (this.checked) {
      span.style.textDecoration = "line-through";
    } else {
      span.style.textDecoration = "none";
    }
  };


  const delBtn = document.createElement("button");
  delBtn.textContent = " Delete";
  delBtn.onclick = function () {
    li.remove();
  };

  li.appendChild(checkbox);
  li.appendChild(span);
  li.appendChild(delBtn);

  document.getElementById("taskList").appendChild(li);

    input.value = "";
}
</script>

</body>
</html>
