<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #616c99, #a960ec);
        font-family: Arial, sans-serif;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 300px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
    }

    button {
        width: 48%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
        color: white;
    }

    .btn-f {
        background: #5517b9;
    }

    .btn-f:hover {
        background: #411664;
    }

    .btn-c {
        background: #764ba2;
    }

    .btn-c:hover {
        background: #5e3a82;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Temperature Converter</h2>

    <input id="c" type="number" placeholder="Celsius" oninput="Fahrenheit()">
    <input id="f" type="number" placeholder="Fahrenheit" oninput="Celsius()">

</div>

<script>
function Fahrenheit(){
    let c = parseFloat(document.getElementById("c").value);
    if (!isNaN(c)) {
        let f = (c * 9 / 5) + 32;
        document.getElementById("f").value = f.toFixed(2);
    }
}

function Celsius(){
    let f = parseFloat(document.getElementById("f").value);
    if (!isNaN(f)) {
        let c = (f - 32) * 5 / 9;
        document.getElementById("c").value = c.toFixed(2);
    }
}
</script>

</body>
</html>
